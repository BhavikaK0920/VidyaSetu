<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="classBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4ED" />
      <stop offset="100%" stop-color="#D1ECE0" />
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="16" fill="url(#classBg)" />
  <!-- Blackboard / Digital Board -->
  <rect x="120" y="40" width="260" height="150" rx="8" fill="#176B55" stroke="#D97706" stroke-width="6" />
  <!-- Math & Science symbols on board -->
  <text x="145" y="85" font-family="sans-serif" font-size="20" fill="#F2B84B" font-weight="bold">VidyaSetu: 1/2 + 1/4 = 3/4</text>
  <path d="M150 110 Q190 95 230 110 T310 110" fill="none" stroke="#E6F4ED" stroke-width="2" stroke-dasharray="4" />
  <text x="150" y="145" font-family="sans-serif" font-size="16" fill="#A7F3D0">🌱 Roots + Sunlight + Water ☀️</text>
  <circle cx="340" cy="140" r="14" fill="#F2B84B" />
  <!-- Teacher -->
  <circle cx="80" cy="180" r="16" fill="#FBBF24" />
  <path d="M60 215 C60 200 100 200 100 215 L95 285 L65 285 Z" fill="#0D9488" />
  <line x1="85" y1="215" x2="115" y2="160" stroke="#0D9488" stroke-width="4" stroke-linecap="round" /> <!-- Pointing to board -->

  <!-- Desk and benches with students -->
  <rect x="120" y="240" width="340" height="15" rx="3" fill="#B45309" />
  <rect x="150" y="255" width="10" height="50" fill="#78350F" />
  <rect x="420" y="255" width="10" height="50" fill="#78350F" />

  <!-- Student 1 -->
  <circle cx="180" cy="210" r="14" fill="#FBBF24" />
  <rect x="168" y="225" width="24" height="25" rx="4" fill="#E11D48" />
  <!-- Tablet on desk -->
  <rect x="170" y="235" width="22" height="14" rx="2" fill="#38BDF8" stroke="#0369A1" stroke-width="1.5" />

  <!-- Student 2 -->
  <circle cx="280" cy="210" r="14" fill="#FBBF24" />
  <rect x="268" y="225" width="24" height="25" rx="4" fill="#2563EB" />
  <rect x="270" y="235" width="20" height="14" rx="1" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5" />

  <!-- Student 3 -->
  <circle cx="380" cy="210" r="14" fill="#FBBF24" />
  <rect x="368" y="225" width="24" height="25" rx="4" fill="#16A34A" />
  <!-- Raised hand -->
  <line x1="395" y1="225" x2="405" y2="175" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
</svg>
